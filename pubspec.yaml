name: gantek
description: Aplicación móvil para la gestión y venta de ganado.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1
  crypto: ^3.0.7
  bcrypt: ^1.2.0
  google_fonts: ^8.2.1
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

integration_test:
    sdk: flutter

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/gantek_icon.png"
  adaptive_icon_background: "#0F5132"
  adaptive_icon_foreground: "assets/icon/gantek_icon.png"